or-framework/harbor/pull/3914\n* fix(swe-agent): install litellm[mcp] so tool calls stop failing by @CatherineYin1213 in https://github.com/harbor-framework/harbor/pull/3854\n* fix(regrade): don't import the source trial's agent to compute the setup timeout by @cktang88 in https://github.com/harbor-framework/harbor/pull/3937\n* fix(tau3, opencode): declare reasoning_effort support on agents that take it by @cktang88 in https://github.com/harbor-framework/harbor/pull/3938\n* feat(hf-sandbox): add namespace option by @aganezov in https://github.com/harbor-framework/harbor/pull/3922\n* fix(environments): keep downloaded logs when tar reports files changed during packing by @vancenate in https://github.com/harbor-framework/harbor/pull/3935\n* feat(environments): add Snowflake Cortex Sandboxes environment provider (--env snowflake) by @sfc-gh-kganesan in https://github.com/harbor-framework/harbor/pull/3918\n* feat(fx): read fx session logs for trajectories and token usage by @fazxes in https://github.com/harbor-framework/harbor/pull/3956\n* fix(registry): implement package dataset listing by @rominparekh in https://github.com/harbor-framework/harbor/pull/3936\n* docs(news): add \"Cracking down on reward hacking\" post by @alexgshaw in https://github.com/harbor-framework/harbor/pull/3968\n* fix(fx): price timed-out steps and each model reply correctly by @fazxes in https://github.com/harbor-framework/harbor/pull/3969\n* remind agent harness authors to reuse auth resolution by @kobe0938 in https://github.com/harbor-framework/harbor/pull/3970\n* Show hosted concurrency limits after job submission by @scvance in https://github.com/harbor-framework/harbor/pull/3973\n* fix(hosted): allow dynamic egress in gateway mode by @scvance in https://github.com/harbor-framework/harbor/pull/3979\n* Default CPU-only Modal Compose tasks to VM and support network policies by @vancenate in https://github.com/harbor-framework/harbor/pull/3982\n* e2b: prebuilt template reuse, create retries, renewable sandbox lease (main) by @mattteufel-e2b in https://github.com/harbor-framework/harbor/pull/3460\n* e2b: content-hash template names, resource-variant tags, launch by build ID by @mattteufel-e2b in https://github.com/harbor-framework/harbor/pull/3461\n* docs: correct task and verifier configuration references by @alexgshaw in https://github.com/harbor-framework/harbor/pull/3988\n* Use the credential proxy default for new hosted CLI submissions by @scvance in https://github.com/harbor-framework/harbor/pull/3985\n* e2b: run as the image user with the image environment and PATH, like docker exec by @mattteufel-e2b in https://github.com/harbor-framework/harbor/pull/3462\n* e2b: tag sandboxes by job and trial, log failed kills by @mattteufel-e2b in https://github.com/harbor-framework/harbor/pull/3463\n* e2b: re-attach to a running command when its stream drops by @mattteufel-e2b in https://github.com/harbor-framework/harbor/pull/3522\n* copilot-cli: report token usage and cost via `--usage-output-file` by @shibbas in https://github.com/harbor-framework/harbor/pull/3990\n* feat: support NeMo Fabric 0.6 in the native agent by @AjayThorve in https://github.com/harbor-framework/harbor/pull/4016\n* fix(modal): tolerate binary exec output and drain both streams by @Skylion007 in https://github.com/harbor-framework/harbor/pull/3934\n* Use Modal VM runtime with runtime=\"vm\" instead of legacy experimental_options by @clairec03 in https://github.com/harbor-framework/harbor/pull/3915\n* feat(runta): support sandbox automatic shutdown and deletion by @ADD-SP in https://github.com/harbor-framework/harbor/pull/3997\n* Rename ACP runner control variables to ACP_RUNNER_* by @andy-zhou in https://github.com/harbor-framework/harbor/pull/3834\n* fix(terminus-2): shrink tmux paste chunks to fit Modal's exec arg limit by @cktang88 in https://github.com/harbor-framework/harbor/pull/4033\n* Add hosted credential proxy configuration models by @scvance in https://github.com/harbor-fram